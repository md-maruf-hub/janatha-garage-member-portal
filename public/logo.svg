<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>
  
  <!-- Outer Group centered -->
  <g transform="translate(0, 0)">
    <!-- Top-Left Green Figure -->
    <circle cx="170" cy="110" r="22" fill="#38B000" />
    <path d="M 130 185 C 130 145, 170 145, 205 145 C 205 175, 180 185, 145 185 Z" fill="#38B000" />
    <path d="M 115 165 C 115 140, 150 135, 175 140 C 160 180, 130 195, 115 165 Z" fill="#38B000" />

    <!-- Top-Right Yellow/Orange Figure -->
    <circle cx="330" cy="110" r="22" fill="#FF9800" />
    <path d="M 370 185 C 370 145, 330 145, 295 145 C 295 175, 320 185, 355 185 Z" fill="#FF9800" />
    <path d="M 385 165 C 385 140, 350 135, 325 140 C 340 180, 370 195, 385 165 Z" fill="#FF9800" />

    <!-- Bottom-Right Red Figure -->
    <circle cx="330" cy="290" r="22" fill="#E53935" />
    <path d="M 370 215 C 370 255, 330 255, 295 255 C 295 225, 320 215, 355 215 Z" fill="#E53935" />
    <path d="M 385 235 C 385 260, 350 265, 325 260 C 340 220, 370 205, 385 235 Z" fill="#E53935" />

    <!-- Bottom-Left Blue Figure -->
    <circle cx="170" cy="290" r="22" fill="#1E88E5" />
    <path d="M 130 215 C 130 255, 170 255, 205 255 C 205 225, 180 215, 145 215 Z" fill="#1E88E5" />
    <path d="M 115 235 C 115 260, 150 265, 175 260 C 160 220, 130 205, 115 235 Z" fill="#1E88E5" />

    <!-- Center Dark Slate Square with Rounded Corners -->
    <rect x="180" y="140" width="140" height="120" rx="36" fill="#1E293B" filter="url(#shadow)" />
    
    <!-- JG Text -->
    <text x="250" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JG</text>

    <!-- Typography: Janatha Garage -->
    <text x="250" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">Janatha</text>
    <text x="250" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">Garage</text>
  </g>
</svg>
